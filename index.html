<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>坦克大战</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
  <canvas id="game" width="800" height="600"></canvas>
</div>

<!-- 双人对战大厅（仅开始界面显示；默认收起成一个小按钮，点开才展开，避免遮挡开始界面文案） -->
<div id="lobby" class="lobby-hidden">
  <button id="lobby-toggle" type="button">双人对战</button>
  <div id="lobby-panel" class="lobby-collapsed">
    <div id="lobby-title">双人对战 <span id="lobby-close" title="收起">×</span></div>
    <div id="lobby-modes">
      <button id="mode-online" type="button" class="mode-tab mode-active">联网开房</button>
      <button id="mode-manual" type="button" class="mode-tab">离线配对</button>
      <button id="mode-relay" type="button" class="mode-tab">自建服务器</button>
    </div>

    <div id="online-pane">
      <input id="room-input" type="text" inputmode="numeric" maxlength="6" pattern="\d{6}"
             placeholder="6 位房间号" autocomplete="off">
      <div id="lobby-btns">
        <button id="btn-host" type="button">开房间</button>
        <button id="btn-join" type="button">加入房间</button>
      </div>
      <div id="net-status"></div>
    </div>

    <div id="relay-pane" class="lobby-hidden">
      <div class="manual-label">服务器地址（启动 server\\relay.js 后它会打印）</div>
      <input id="relay-url" type="text" placeholder="http://192.168.1.5:8000" autocomplete="off">
      <input id="relay-room" type="text" inputmode="numeric" maxlength="8" pattern="\d{4,8}"
             placeholder="4~8 位房间号" autocomplete="off">
      <div id="relay-cap-row">
        <label for="relay-cap">房间人数</label>
        <select id="relay-cap">
          <option value="2" selected>2 人</option>
          <option value="3">3 人</option>
          <option value="4">4 人</option>
          <option value="5">5 人</option>
          <option value="6">6 人</option>
        </select>
      </div>
      <div id="relay-btns">
        <button id="btn-relay-host" type="button">开房间</button>
        <button id="btn-relay-join" type="button">加入房间</button>
      </div>
      <div id="relay-room-info" class="lobby-hidden"></div>
      <div id="relay-status"></div>
    </div>

    <div id="manual-pane" class="lobby-hidden">
      <button id="btn-make-invite" type="button" class="manual-btn">生成邀请码（主机）</button>
      <div class="manual-label">自己生成的码（复制发给对方）</div>
      <textarea id="manual-out" wrap="off" readonly
                placeholder="生成的邀请码 / 应答码会显示在这里"></textarea>
      <button id="btn-copy" type="button" class="manual-btn">复制</button>

      <div class="manual-label">客机：把对方发来的邀请码粘到这里</div>
      <textarea id="manual-in-invite" wrap="off" placeholder="粘贴邀请码"></textarea>
      <button id="btn-use-invite" type="button" class="manual-btn">用邀请码生成应答码（客机）</button>

      <div class="manual-label">主机：把对方发回的应答码粘到这里</div>
      <textarea id="manual-in-answer" wrap="off" placeholder="粘贴应答码"></textarea>
      <button id="btn-accept-answer" type="button" class="manual-btn">完成连接（主机）</button>

      <div id="manual-status"></div>
    </div>

    <div id="lobby-hint">单人游戏：按任意键直接开始</div>
  </div>
</div>

<!-- 触屏控件层（仅触屏设备显示） -->
<div id="touch-overlay" class="touch-hidden">
  <div id="joystick-zone">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
  </div>
  <button id="fire-btn" type="button">开火</button>
  <button id="pause-btn" type="button">II</button>
  <button id="restart-btn" type="button" class="touch-hidden">重开</button>
  <div id="mobile-hint">
    拖动左下摇杆移动 · 点右下按钮开火
    <span id="hint-close">×</span>
  </div>
</div>

<script src="vendor/peerjs.min.js"></script>
<script src="net.js"></script>
<script src="game.js"></script>
<script>
/* 大厅交互：联网开房 + 离线配对（复制粘贴邀请码）。任何异常都不影响单人模式 */
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var lobby = $('lobby'), input = $('room-input'),
      btnHost = $('btn-host'), btnJoin = $('btn-join'), statusEl = $('net-status'),
      panel = $('lobby-panel'), toggleBtn = $('lobby-toggle'), closeBtn = $('lobby-close'),
      modeOnline = $('mode-online'), modeManual = $('mode-manual'),
      onlinePane = $('online-pane'), manualPane = $('manual-pane'),
      modeRelay = $('mode-relay'), relayPane = $('relay-pane'),
      relayUrlInput = $('relay-url'), relayRoomInput = $('relay-room'),
      btnRelayHost = $('btn-relay-host'), btnRelayJoin = $('btn-relay-join'),
      relayStatusEl = $('relay-status'),
      relayCapSel = $('relay-cap'), relayCapRow = $('relay-cap-row'),
      relayBtns = $('relay-btns'), relayRoomInfo = $('relay-room-info'),
      btnMakeInvite = $('btn-make-invite'), btnUseInvite = $('btn-use-invite'),
      btnAcceptAnswer = $('btn-accept-answer'), btnCopy = $('btn-copy'),
      inInvite = $('manual-in-invite'), inAnswer = $('manual-in-answer'),
      outCode = $('manual-out'), manualStatusEl = $('manual-status');
  if (!lobby || !input || !btnHost || !btnJoin || !statusEl) return;

  // 面板内按键不冒泡，避免打字/空格触发游戏“任意键开始”
  try {
    panel.addEventListener('keydown', function (e) { e.stopPropagation(); });
    panel.addEventListener('keyup', function (e) { e.stopPropagation(); });
  } catch (e) {}

  // 大厅默认收起成右上角小按钮，点开才展开，避免遮挡开始界面的操作说明
  var expanded = false;
  function setExpanded(v) {
    expanded = !!v;
    if (panel) panel.classList.toggle('lobby-collapsed', !expanded);
    if (toggleBtn) toggleBtn.classList.toggle('lobby-hidden', expanded);
  }
  if (toggleBtn) toggleBtn.addEventListener('click', function () { setExpanded(true); try { input.focus(); } catch (e) {} });
  if (closeBtn) closeBtn.addEventListener('click', function () { setExpanded(false); });
  setExpanded(false);

  function setStatus(msg) { statusEl.textContent = msg || ''; }
  function setManualStatus(msg) { if (manualStatusEl) manualStatusEl.textContent = msg || ''; }
  function setBusy(busy) {
    btnHost.disabled = busy; btnJoin.disabled = busy; input.disabled = busy;
  }
  function setManualBusy(busy) {
    if (btnMakeInvite) btnMakeInvite.disabled = busy;
    if (btnUseInvite) btnUseInvite.disabled = busy;
    if (btnAcceptAnswer) btnAcceptAnswer.disabled = busy;
  }

  // ---------------- 模式切换：联网开房 / 离线配对 / 自建服务器 ----------------
  var currentMode = 'online';
  function setMode(m) {
    currentMode = (m === 'manual' || m === 'relay') ? m : 'online';
    var isOnline = currentMode === 'online';
    var isManual = currentMode === 'manual';
    var isRelay = currentMode === 'relay';
    if (onlinePane) onlinePane.classList.toggle('lobby-hidden', !isOnline);
    if (manualPane) manualPane.classList.toggle('lobby-hidden', !isManual);
    if (relayPane) relayPane.classList.toggle('lobby-hidden', !isRelay);
    if (modeOnline) modeOnline.classList.toggle('mode-active', isOnline);
    if (modeManual) modeManual.classList.toggle('mode-active', isManual);
    if (modeRelay) modeRelay.classList.toggle('mode-active', isRelay);
    if (panel) panel.classList.toggle('lobby-wide', !isOnline);
  }
  if (modeOnline) modeOnline.addEventListener('click', function () { setMode('online'); });
  if (modeManual) modeManual.addEventListener('click', function () { setMode('manual'); });
  if (modeRelay) modeRelay.addEventListener('click', function () { setMode('relay'); });
  setMode('online');

  function setRelayStatus(msg) { if (relayStatusEl) relayStatusEl.textContent = msg || ''; }
  function setRelayBusy(b) {
    if (btnRelayHost) btnRelayHost.disabled = b;
    if (btnRelayJoin) btnRelayJoin.disabled = b;
    if (relayUrlInput) relayUrlInput.disabled = b;
    if (relayRoomInput) relayRoomInput.disabled = b;
    if (relayCapSel) relayCapSel.disabled = b;
  }

  // 等待开局：显示 "x/y 人已加入"，并隐藏开房/加入按钮与人数选择
  var relayWaiting = false;
  var relayStarted = false;
  var relayRoom = null;
  function renderRelayRoom() {
    if (!relayRoomInfo) return;
    var cap = (relayRoom && relayRoom.cap) || (window.Net && window.Net.cap) || 2;
    var n = (relayRoom && relayRoom.n) || 0;
    relayRoomInfo.textContent = n + '/' + cap + ' 人已加入，' +
      (relayRoom && relayRoom.started ? '正在开局…' : '等待其他人…');
  }
  function setRelayWaiting(on) {
    relayWaiting = !!on;
    if (relayRoomInfo) relayRoomInfo.classList.toggle('lobby-hidden', !on);
    if (relayBtns) relayBtns.classList.toggle('lobby-hidden', !!on);
    if (relayCapRow) relayCapRow.classList.toggle('lobby-hidden', !!on);
  }

  function startRelay(isHost) {
    if (!window.Net || typeof window.Net.relay !== 'function') { setRelayStatus('当前版本不支持自建服务器模式'); return; }
    var url = (relayUrlInput && relayUrlInput.value ? relayUrlInput.value : '').trim() || location.origin;
    var room = (relayRoomInput && relayRoomInput.value ? relayRoomInput.value : '').trim();
    if (!/^\d{4,8}$/.test(room)) { setRelayStatus('请输入 4~8 位数字房间号'); return; }
    var cap = parseInt(relayCapSel && relayCapSel.value, 10);
    if (!isFinite(cap)) cap = 2;
    cap = Math.max(2, Math.min(6, cap));
    duelStarted = false;
    relayStarted = false;
    setRelayBusy(true);
    setRelayStatus(isHost ? '正在创建房间…' : '正在加入房间…');
    window.Net.relay(url, room, isHost, cap).then(function () {
      // 连接成功≠开局：等待服务端广播 room / start
    }).catch(function (e) {
      setRelayBusy(false);
      setRelayWaiting(false);
      setRelayStatus((e && e.message) || '连接失败，请重试');
    });
  }
  if (btnRelayHost) btnRelayHost.addEventListener('click', function () { startRelay(true); });
  if (btnRelayJoin) btnRelayJoin.addEventListener('click', function () { startRelay(false); });
  if (relayRoomInput) relayRoomInput.addEventListener('input', function () {
    relayRoomInput.value = relayRoomInput.value.replace(/\D/g, '').slice(0, 8);
  });
  // 本页若由自建服务器提供，自动预填地址
  (function detectRelay() {
    try {
      if (!relayUrlInput || !/^https?:/.test(location.protocol)) return;
      fetch('/health', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (j && j.relay) {
            relayUrlInput.value = location.origin;
            setRelayStatus('已检测到本页由自建服务器提供，可直接开房');
          }
        })
        .catch(function () {});
    } catch (e) {}
  })();

  // 输入框只允许 6 位数字
  input.addEventListener('input', function () {
    input.value = input.value.replace(/\D/g, '').slice(0, 6);
  });

  // ---------------- 复制（无剪贴板权限时降级，不报错） ----------------
  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) { return false; }
  }
  function copyText(text) {
    if (!text) return Promise.resolve(false);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(function () { return true; })
          .catch(function () { return legacyCopy(text); });
      }
    } catch (e) {}
    return Promise.resolve(legacyCopy(text));
  }

  var duelStarted = false;
  var hideForDuel = false;

  // 连接成功后进入对战；startDuel 可能尚未实现，判空并等它出现
  function tryStartDuel() {
    if (duelStarted) return;
    var g = window.__game;
    if (g && typeof g.startDuel === 'function') {
      duelStarted = true;
      try { g.startDuel(!!(window.Net && window.Net.isHost)); } catch (e) { console.error(e); }
    }
  }

  // 自建服务器多人房间：由服务端广播 'start' 触发。
  // 新签名 startDuel(isHost, seat, cap)；旧签名只有 isHost，多传的参数会被自动忽略
  function tryStartRelayDuel() {
    if (duelStarted) return;
    var g = window.__game;
    if (!g || typeof g.startDuel !== 'function') return;
    duelStarted = true;
    var isHost = !!(window.Net && window.Net.isHost);
    var seat = (window.Net && typeof window.Net.seat === 'number') ? window.Net.seat : (isHost ? 0 : 1);
    var cap = (window.Net && window.Net.cap) || 2;
    try { g.startDuel(isHost, seat, cap); } catch (e) { console.error(e); }
  }

  function readCode() {
    var code = input.value.trim();
    if (!/^\d{6}$/.test(code)) { setStatus('请输入 6 位数字房间号'); return null; }
    return code;
  }

  var Net = window.Net;
  if (!Net) {
    setBusy(true);
    setManualBusy(true);
    setStatus('联机模块未加载，仅可单人游戏');
    setManualStatus('联机模块未加载，仅可单人游戏');
  } else {
    // ---- 联网开房（原逻辑保持不变） ----
    btnHost.addEventListener('click', function () {
      var code = readCode(); if (!code) return;
      duelStarted = false;
      setBusy(true);
      setStatus('正在创建房间…');
      Net.host(code);
    });
    btnJoin.addEventListener('click', function () {
      var code = readCode(); if (!code) return;
      duelStarted = false;
      setBusy(true);
      setStatus('正在加入房间…');
      Net.join(code);
    });

    // ---- 离线配对 ----
    if (btnMakeInvite) btnMakeInvite.addEventListener('click', function () {
      if (typeof Net.createInvite !== 'function') { setManualStatus('当前版本不支持离线配对'); return; }
      duelStarted = false;
      setManualBusy(true);
      if (outCode) outCode.value = '';
      setManualStatus('正在生成邀请码…');
      Net.createInvite().then(function (code) {
        if (outCode) outCode.value = code;
        return copyText(code).then(function (ok) {
          setManualBusy(false);
          setManualStatus(ok
            ? '邀请码已生成并已尝试复制。把它发给对方，等对方发回应答码后粘到下面的框里，再点「完成连接（主机）」。'
            : '邀请码已生成，自动复制失败，请手动全选复制发给对方；收到应答码后粘到下面的框里，再点「完成连接（主机）」。');
        });
      }).catch(function (err) {
        setManualBusy(false);
        setManualStatus((err && err.message) || '生成邀请码失败，请重试');
      });
    });

    if (btnUseInvite) btnUseInvite.addEventListener('click', function () {
      if (typeof Net.useInvite !== 'function') { setManualStatus('当前版本不支持离线配对'); return; }
      var code = inInvite ? inInvite.value.trim() : '';
      if (!code) { setManualStatus('请先把对方发来的邀请码粘贴到上面的框里'); return; }
      duelStarted = false;
      setManualBusy(true);
      if (outCode) outCode.value = '';
      setManualStatus('正在根据邀请码生成应答码…');
      Net.useInvite(code).then(function (answer) {
        if (outCode) outCode.value = answer;
        return copyText(answer).then(function (ok) {
          setManualBusy(false);
          setManualStatus(ok
            ? '应答码已生成并已尝试复制。请把它发回给主机；主机点「完成连接」后双方会自动连上。'
            : '应答码已生成，自动复制失败，请手动全选复制发回给主机；主机点「完成连接」后双方会自动连上。');
        });
      }).catch(function (err) {
        setManualBusy(false);
        setManualStatus((err && err.message) || '生成应答码失败，请确认邀请码已完整复制');
      });
    });

    if (btnAcceptAnswer) btnAcceptAnswer.addEventListener('click', function () {
      if (typeof Net.acceptAnswer !== 'function') { setManualStatus('当前版本不支持离线配对'); return; }
      var code = inAnswer ? inAnswer.value.trim() : '';
      if (!code) { setManualStatus('请先把对方发回的应答码粘贴到上面的框里'); return; }
      setManualBusy(true);
      setManualStatus('正在建立直连…');
      Net.acceptAnswer(code).then(function () {
        setManualBusy(false);
        setManualStatus('连接成功，正在进入对战…');
      }).catch(function (err) {
        setManualBusy(false);
        setManualStatus((err && err.message) || '连接失败，请重新生成邀请码再试');
      });
    });

    if (btnCopy) btnCopy.addEventListener('click', function () {
      var text = outCode ? outCode.value : '';
      if (!text) { setManualStatus('还没有可复制的码，请先生成'); return; }
      copyText(text).then(function (ok) {
        setManualStatus(ok ? '已复制到剪贴板' : '复制失败（可能无剪贴板权限），请手动全选复制');
      });
    });

    // ---- 公共事件 ----
    Net.on('peer', function () {
      if (currentMode !== 'online') return;
      setStatus(Net.isHost ? '房间已创建，等待对方加入…' : '已连接服务器，正在加入…');
    });
    Net.on('open', function () {
      if (currentMode === 'relay') {
        // 自建服务器：连上只是进了房间，等人数够了由服务端广播 start 才开局
        relayRoom = {
          cap: (Net.cap || 2),
          n: 1,
          seats: (typeof Net.seat === 'number' ? [Net.seat] : []),
          started: false
        };
        setRelayBusy(true);
        setRelayWaiting(true);
        renderRelayRoom();
        setRelayStatus('已进入房间 ' + (relayRoomInput && relayRoomInput.value ? relayRoomInput.value.trim() : ''));
        return;
      }
      if (currentMode === 'manual') setManualStatus('连接成功，正在进入对战…');
      else setStatus('连接成功！正在进入对战…');
      hideForDuel = true;
      setExpanded(false);
      lobby.classList.add('lobby-hidden');
      tryStartDuel();
    });
    // 房间状态：{cap, n, seats, started}
    Net.on('room', function (info) {
      if (!info) return;
      relayRoom = info;
      if (info.cap) Net.cap = info.cap;
      // 已开局后不再用房间状态覆盖「某人已离开」的提示（大厅此时已隐藏）
      if (!relayStarted) {
        if (info.started || (info.n >= info.cap)) {
          setRelayStatus('房间已满，即将开局…');
        } else {
          setRelayStatus('房间号 ' + (relayRoomInput && relayRoomInput.value ? relayRoomInput.value.trim() : '') + '，等待其他人加入…');
        }
      }
      renderRelayRoom();
      if (relayRoomInfo) relayRoomInfo.classList.remove('lobby-hidden');
    });
    // 人满自动开局
    Net.on('start', function () {
      relayStarted = true;
      renderRelayRoom();
      setRelayStatus('人已到齐，正在开局…');
      hideForDuel = true;
      setExpanded(false);
      lobby.classList.add('lobby-hidden');
      tryStartRelayDuel();
    });
    // 开局后有人离开：提示座位号
    Net.on('peer-left', function (p) {
      var seat = (p && typeof p.seat === 'number') ? p.seat : '?';
      setRelayStatus('座位 ' + seat + ' 的玩家已离开');
      if (relayRoom) {
        relayRoom.n = Math.max(0, (relayRoom.n || 1) - 1);
        renderRelayRoom();
      }
    });
    Net.on('error', function (err) {
      var msg = (err && err.message) || '连接失败，请重试';
      setBusy(false);
      setManualBusy(false);
      setRelayBusy(false);
      relayWaiting = false;
      relayStarted = false;
      setRelayWaiting(false);
      if (currentMode === 'manual') setManualStatus(msg);
      else if (currentMode === 'relay') setRelayStatus(msg);
      else setStatus(msg);
    });
    Net.on('leave', function () {
      setBusy(false);
      setManualBusy(false);
      setRelayBusy(false);
      duelStarted = false;
      hideForDuel = false;
      relayWaiting = false;
      relayStarted = false;
      setRelayWaiting(false);
      var msg = '连接已断开，可重新开房或配对';
      if (currentMode === 'manual') setManualStatus(msg);
      else if (currentMode === 'relay') setRelayStatus(msg);
      else setStatus(msg);
    });
  }

  // 大厅仅在开始界面显示；__game 尚不可用则隐藏，单人模式完全不受影响
  setInterval(function () {
    try {
      var g = window.__game;
      var inStart = !!(g && g.state === 'start');
      lobby.classList.toggle('lobby-hidden', !inStart || hideForDuel);
      if (!inStart || duelStarted) return;
      if (relayStarted) { tryStartRelayDuel(); return; }
      // 自建服务器：人没到齐（或还没收到 start）就先不开局
      if (relayWaiting) return;
      if (Net && Net.status() === 'connected') tryStartDuel();
    } catch (e) {}
  }, 200);
})();
</script>
</body>
</html>
