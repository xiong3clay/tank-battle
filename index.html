<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>坦克大战</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
  <canvas id="game" width="800" height="600"></canvas>
</div>

<!-- 触屏控件层（仅触屏设备显示） -->
<div id="touch-overlay" class="touch-hidden">
  <div id="joystick-zone">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
  </div>
  <button id="fire-btn" type="button">开火</button>
  <button id="pause-btn" type="button">II</button>
  <button id="restart-btn" type="button" class="touch-hidden">重开</button>
  <div id="mobile-hint">
    拖动左下摇杆移动 · 点右下按钮开火
    <span id="hint-close">×</span>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
